name: Dependency audit
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 8 * * 1'
permissions:
  contents: read
concurrency:
  group: dependencies-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.11.28'
      - run: uv sync --frozen
      - name: Audit installed Python packages
        run: uvx --from pip-audit==2.10.1 pip-audit --path .venv/lib/python3.12/site-packages --format json --output python-audit.json
      - name: Audit the complete optional CPU model lock
        run: uvx --from pip-audit==2.10.1 pip-audit --require-hashes --disable-pip -r requirements-ml-cpu.lock --format json --output optional-ml-audit.json
      - name: Check public model releases including the CPU Torch equivalent
        # PyPI advisories use 2.13.0, not the vendor wheel's 2.13.0+cpu label.
        run: uvx --from pip-audit==2.10.1 pip-audit --no-deps --disable-pip -r requirements-ml.txt --format json --output optional-ml-direct-audit.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.16.0'
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=low --json > npm-audit.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: dependency-audits
          path: '*-audit.json'
          retention-days: 14
